</head>
<body class="bg-slate-50 text-slate-900 min-h-screen">
<main class="max-w-4xl mx-auto p-4 sm:p-6">
  <header class="mb-6">
    <h1 class="text-2xl font-bold">Voucher Entri Transaksi Kas Keluar</h1>
    <p class="text-sm text-slate-600">Purwarupa modul jurnal. Validasi di layar ini hanya kemudahan bagi pengguna; penegakan Debit = Kredit yang sebenarnya dilakukan oleh database (trigger + RPC).</p>
    <p id="mode" class="mt-2 inline-block text-xs font-medium rounded px-2 py-1 bg-amber-100 text-amber-900"></p>
  </header>

  <form id="f" class="space-y-6" novalidate>
    <section class="bg-white rounded-lg shadow-sm border border-slate-200 p-4 grid gap-4 sm:grid-cols-3">
      <div>
        <label for="trx_date" class="block text-sm font-medium mb-1">Tanggal transaksi</label>
        <input id="trx_date" type="date" required class="w-full rounded border border-slate-300 px-3 py-2">
      </div>
      <div>
        <label for="ref_no" class="block text-sm font-medium mb-1">No. bukti / voucher</label>
        <input id="ref_no" type="text" maxlength="50" required placeholder="KK-2026-0001" class="w-full rounded border border-slate-300 px-3 py-2">
      </div>
      <div class="sm:col-span-3">
        <label for="desc" class="block text-sm font-medium mb-1">Deskripsi</label>
        <input id="desc" type="text" required placeholder="mis. Pembayaran listrik Oktober 2026" class="w-full rounded border border-slate-300 px-3 py-2">
      </div>
    </section>

    <section class="bg-white rounded-lg shadow-sm border border-slate-200 p-4">
      <div class="flex items-center justify-between mb-3">
        <h2 class="font-semibold">Baris jurnal</h2>
        <button type="button" id="add" class="text-sm rounded bg-slate-800 text-white px-3 py-1.5 hover:bg-slate-700">+ Tambah baris</button>
      </div>
      <div class="hidden sm:grid grid-cols-12 gap-2 text-xs font-medium text-slate-500 mb-1 px-1">
        <div class="col-span-6">Akun</div><div class="col-span-3 text-right">Debit (Rp)</div><div class="col-span-2 text-right">Kredit (Rp)</div><div class="col-span-1"></div>
      </div>
      <div id="lines" class="space-y-2"></div>

      <div class="mt-4 border-t border-slate-200 pt-3 grid grid-cols-12 gap-2 text-sm font-semibold">
        <div class="col-span-6 text-right sm:text-left">Total</div>
        <div class="col-span-3 text-right" id="tot_dr">0,00</div>
        <div class="col-span-2 text-right" id="tot_cr">0,00</div>
        <div class="col-span-1"></div>
      </div>

      <div id="indicator" role="status" aria-live="polite" class="mt-4 rounded px-3 py-2 text-sm font-semibold"></div>
    </section>

    <section class="bg-white rounded-lg shadow-sm border border-slate-200 p-4">
      <h2 class="font-semibold mb-2">Syarat sebelum Submit aktif</h2>
      <ul id="rules" class="text-sm space-y-1"></ul>
    </section>

    <div class="flex items-center gap-3">
      <button id="submit" type="submit" disabled class="rounded bg-emerald-600 text-white px-5 py-2 font-medium disabled:bg-slate-300 disabled:text-slate-500 disabled:cursor-not-allowed">Submit &amp; Posting</button>
      <button type="button" id="reset" class="rounded border border-slate-300 px-4 py-2 text-sm">Reset</button>
    </div>
    <pre id="result" class="hidden bg-slate-900 text-slate-100 text-xs rounded p-3 overflow-x-auto"></pre>
  </form>
</main>

<script>
/* ===== Konfigurasi Supabase (kosongkan = mode demo tanpa database) ===== */
const SUPABASE_URL = "https://yhnkmuaqsurbgypkcljl.supabase.co";       // https://xxxx.supabase.co
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InlobmttdWFxc3VyYmd5cGtjbGpsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTE4NzAwMTYsImV4cCI6MjEwNzQ0NjAxNn0.ptCb22_O1gWvLRNNZvySKyZ-6H_rBpWdgneriEi1TIM";  // anon public key (JANGAN pernah memakai service_role di browser)

const DEMO_ACCOUNTS = [
  {code:"1-1100", name:"Kas dan Setara Kas", is_cash:true},
  {code:"1-1200", name:"Bank BCA",           is_cash:true},
  {code:"1-1300", name:"Persediaan Barang Dagang", is_cash:false},
  {code:"2-1100", name:"Utang Usaha",        is_cash:false},
  {code:"5-1100", name:"Beban Pokok Pendapatan (HPP)", is_cash:false},
  {code:"6-1100", name:"Beban Listrik",      is_cash:false},
  {code:"6-1200", name:"Beban Gaji",         is_cash:false},
];

let accounts = DEMO_ACCOUNTS, sb = null;

/* ===== Aritmetika uang: integer sen, tanpa floating point ===== */
const MONEY_RE = /^\d+([.,]\d{1,2})?$/;
function toSen(str){                       // "1500000.5" -> 150000050 ; invalid -> null ; "" -> 0
  const s = String(str ?? "").trim();
  if (s === "") return 0;
  if (!MONEY_RE.test(s)) return null;
  const [i, d = ""] = s.replace(",", ".").split(".");
  return parseInt(i, 10) * 100 + parseInt((d + "00").slice(0, 2), 10);
}
const fmt = sen => (sen/100).toLocaleString("id-ID", {minimumFractionDigits:2, maximumFractionDigits:2});
const senToStr = sen => (Math.floor(sen/100)) + "." + String(sen % 100).padStart(2, "0");

/* ===== DOM ===== */
const $ = id => document.getElementById(id);
const linesEl = $("lines");

function accountOptions(){
  return '<option value="">- pilih akun -</option>' +
    accounts.map(a => `<option value="${a.code}">${a.code} - ${a.name}</option>`).join("");
}
function addLine(acc="", dr="", cr=""){
  const row = document.createElement("div");
  row.className = "line grid grid-cols-12 gap-2 items-start";
  row.innerHTML = `
    <div class="col-span-12 sm:col-span-6">
      <select aria-label="Akun" class="acc w-full rounded border border-slate-300 px-2 py-2 bg-white">${accountOptions()}</select>
    </div>
    <div class="col-span-5 sm:col-span-3"><input aria-label="Debit" inputmode="decimal" placeholder="0" class="dr w-full rounded border border-slate-300 px-2 py-2 text-right"></div>
    <div class="col-span-5 sm:col-span-2"><input aria-label="Kredit" inputmode="decimal" placeholder="0" class="cr w-full rounded border border-slate-300 px-2 py-2 text-right"></div>
    <div class="col-span-2 sm:col-span-1 text-right"><button type="button" class="del rounded px-2 py-2 text-slate-500 hover:text-red-600" aria-label="Hapus baris">&#10005;</button></div>`;
  row.querySelector(".acc").value = acc;
  row.querySelector(".dr").value = dr;
  row.querySelector(".cr").value = cr;
  linesEl.appendChild(row);
}
function readLines(){
  return [...linesEl.querySelectorAll(".line")].map(r => ({
    code: r.querySelector(".acc").value,
    drRaw: r.querySelector(".dr").value, crRaw: r.querySelector(".cr").value,
    dr: toSen(r.querySelector(".dr").value), cr: toSen(r.querySelector(".cr").value), el: r }));
}

/* ===== Evaluasi aturan (dipanggil pada setiap perubahan) ===== */
function evaluate(){
  const L = readLines();
  const isCash = code => !!(accounts.find(a => a.code === code) || {}).is_cash;
  let totDr = 0, totCr = 0, cashOut = 0, badLine = false;

  L.forEach(l => {
    const invalid = l.dr === null || l.cr === null;
    const both = !invalid && l.dr > 0 && l.cr > 0;
    const none = !invalid && l.dr === 0 && l.cr === 0;
    const noAcc = l.code === "";
    const bad = invalid || both || none || noAcc;
    if (bad) badLine = true;
    l.el.querySelectorAll("select,input").forEach(x => x.classList.toggle("border-red-500", bad && (document.activeElement !== x)));
    if (!invalid){ totDr += l.dr; totCr += l.cr; if (isCash(l.code)) cashOut += l.cr - l.dr; }
  });

  $("tot_dr").textContent = fmt(totDr);
  $("tot_cr").textContent = fmt(totCr);

  const diff = totDr - totCr, balanced = totDr > 0 && diff === 0;
  const ind = $("indicator");
  ind.className = "mt-4 rounded px-3 py-2 text-sm font-semibold " +
    (balanced ? "bg-emerald-100 text-emerald-900" : "bg-red-100 text-red-900");
  ind.textContent = balanced ? "✓ SEIMBANG - Total Debit = Total Kredit"
    : (totDr === 0 && totCr === 0 ? "✗ Belum ada nominal"
       : `✗ TIDAK SEIMBANG - selisih Rp ${fmt(Math.abs(diff))} (${diff > 0 ? "debit lebih besar" : "kredit lebih besar"})`);

  const d = $("trx_date").value, today = new Date().toISOString().slice(0,10);
  const rules = [
    ["Tanggal, no. bukti, dan deskripsi terisi, tanggal tidak di masa depan", !!d && d <= today && $("ref_no").value.trim() !== "" && $("desc").value.trim() !== ""],
    ["Minimal 2 baris jurnal", L.length >= 2],
    ["Setiap baris: akun dipilih, nominal valid (maks. 2 desimal), hanya salah satu debit/kredit > 0", L.length > 0 && !badLine],
    ["Total Debit = Total Kredit dan > 0", balanced],
    ["Mengkredit akun kas/bank (kas keluar bersih > 0)", cashOut > 0],
  ];
  $("rules").innerHTML = rules.map(([t, ok]) =>
    `<li class="${ok ? "text-emerald-700" : "text-red-700"}">${ok ? "✓" : "✗"} ${t}</li>`).join("");

  const ok = rules.every(r => r[1]);
  $("submit").disabled = !ok;
  return {ok, L};
}

/* ===== Submit ===== */
async function submitVoucher(e){
  e.preventDefault();
  const {ok, L} = evaluate();
  if (!ok) return;                                     // pengaman ganda jika tombol dipaksa aktif via DevTools
  const payload = {
    p_trx_date: $("trx_date").value,
    p_reference_no: $("ref_no").value.trim(),
    p_description: $("desc").value.trim(),
    p_lines: L.map(l => ({account_code: l.code, debit: senToStr(l.dr), credit: senToStr(l.cr)})),
  };
  const out = $("result"); out.classList.remove("hidden");
  $("submit").disabled = true;
  try {
    if (!sb){ out.textContent = "MODE DEMO - payload yang akan dikirim ke supabase.rpc('rpc_post_cash_disbursement'):\n" + JSON.stringify(payload, null, 2); return; }
    const {data, error} = await sb.rpc("rpc_post_cash_disbursement", payload);
    out.textContent = error ? "DITOLAK DATABASE: " + error.message : "BERHASIL diposting. header_id = " + data;
  } catch (err){ out.textContent = "Kesalahan jaringan: " + err.message; }
  finally { evaluate(); }
}

/* ===== Init ===== */
async function init(){
  $("trx_date").value = new Date().toISOString().slice(0,10);
  if (SUPABASE_URL && SUPABASE_ANON_KEY){
    const {createClient} = await import("https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/+esm");
    sb = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    const {data, error} = await sb.from("chart_of_accounts").select("account_code,account_name,is_cash").eq("is_active", true).order("account_code");
    if (!error) accounts = data.map(a => ({code:a.account_code, name:a.account_name, is_cash:a.is_cash}));
    $("mode").textContent = "Terhubung ke Supabase"; $("mode").className = "mt-2 inline-block text-xs font-medium rounded px-2 py-1 bg-emerald-100 text-emerald-900";
  } else $("mode").textContent = "Mode demo (belum terhubung ke database)";
  addLine(); addLine(); evaluate();
}
$("add").onclick = () => { addLine(); evaluate(); };
$("reset").onclick = () => { linesEl.innerHTML = ""; ["ref_no","desc"].forEach(i => $(i).value = ""); $("result").classList.add("hidden"); addLine(); addLine(); evaluate(); };
$("f").addEventListener("input", () => { $("result").classList.add("hidden"); evaluate(); });
$("f").addEventListener("change", evaluate);
$("f").addEventListener("submit", submitVoucher);
linesEl.addEventListener("click", e => { if (e.target.closest(".del")){ e.target.closest(".line").remove(); evaluate(); } });
init();
</script>
